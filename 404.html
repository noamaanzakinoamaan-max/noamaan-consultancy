<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Noamaan Consultancy Services</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c8a24a'/><text x='50' y='72' font-size='62' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%231a1500'>N</text></svg>" />
  <meta name="theme-color" content="#0a0b0f" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(1000px 500px at 80% -10%, rgba(200,162,74,.12), transparent 60%),
        linear-gradient(180deg,#0a0b0f,#0f1117);
      color:#eef1f6;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
    }
    .wrap{max-width:560px}
    .mark{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin:0 auto 28px;
      background:linear-gradient(135deg,#c8a24a,#e7c877);color:#1a1500;font-family:Georgia,serif;font-weight:700;font-size:2rem;box-shadow:0 12px 30px rgba(200,162,74,.35)}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(3.5rem,12vw,6rem);color:#e7c877;line-height:1;margin-bottom:10px}
    h2{font-family:Georgia,serif;font-size:1.6rem;font-weight:600;margin-bottom:14px}
    p{color:#9aa2b1;font-size:1.05rem;line-height:1.6;margin-bottom:30px}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    a.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:60px;font-weight:700;font-size:.95rem;text-decoration:none;transition:.3s}
    .gold{background:linear-gradient(135deg,#c8a24a,#e7c877);color:#1a1500;box-shadow:0 10px 30px rgba(200,162,74,.3)}
    .gold:hover{transform:translateY(-3px)}
    .ghost{border:1px solid rgba(200,162,74,.3);color:#eef1f6}
    .ghost:hover{border-color:#e7c877;color:#e7c877;transform:translateY(-3px)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">N</div>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track — or reach out and we'll help you directly.</p>
    <div class="btns">
      <a class="btn gold" href="/">Back to Home</a>
      <a class="btn ghost" href="tel:+918369940174">Call +91 83699 40174</a>
    </div>
  </div>
</body>
</html>
